<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign Up</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="signuppage.css"/>
</head>
<body>
    <div class="container">
        <div class="left">
            <a href="Mainpage.html">
                <img alt="Logo" class="logo" src="https://ik.imagekit.io/Maxime/world-globe-earth-planet-book-620-Photoroom.png?updatedAt=1734265285219" />
            </a>
            <h1>BookWord</h1>
            <p>LIBRARY</p>
            <div class="button-container">
                <p>Already have an Account? Sign In now.</p>
                <a href="signinandsignuppage.html" class="button-link">SIGN IN</a>
            </div>
            
            
        </div>
        <div class="right">
            <h2>Sign Up</h2>
            <p>Please provide your information to sign up.</p>
            <form onsubmit="signUp(); return false;">
                <input id="signup-firstname" placeholder="First Name" type="text" required />
                <input id="signup-lastname" placeholder="Last Name" type="text" required />
                <input id="signup-contact" placeholder="Contact No" type="text" required />
                <input id="signup-email" placeholder="Email" type="email" required />
                <input id="signup-username" placeholder="Username" type="text" required />
                <input id="signup-password" placeholder="Password" type="password" required />
                <button type="submit">SIGN UP</button>
            </form>
            <script src="auth.js"></script>
            
                <script src="auth.js"></script>
            <p><a href="resetpasswordpage.html" style="color: black ;text-decoration: none; ">Forgot Password?</a></p>
        </div>
    </div>
</body>
</html>
