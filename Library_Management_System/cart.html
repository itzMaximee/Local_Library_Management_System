<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="cart-container">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>
        <div id="total"></div>
        <button onclick="checkout()">Proceed to Checkout</button>
    </div>

    <script>
        // Function to load cart items from localStorage
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
                document.getElementById('total').innerHTML = '';
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.cover}" alt="${item.title}">
                    <p><strong>${item.title}</strong></p>
                    <p>By ${item.author}</p>
                    <p>Category: ${item.type}</p>
                    <p>Price: $${parseFloat(item.price).toFixed(2)}</p>
                    <p>Quantity: ${item.quantity}</p>
                    <button onclick="removeFromCart('${item.title}')">Remove</button>
                </div>
            `).join('');

            // Calculate total price
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('total').innerHTML = `<h3>Total: $${total.toFixed(2)}</h3>`;
        }

        // Function to remove a book from the cart
        function removeFromCart(title) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.title !== title);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        // Function to proceed to the checkout page
        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length > 0) {
                alert('Proceeding to checkout...');
                window.location.href = 'checkout.html';
            } else {
                alert('Your cart is empty!');
            }
        }

        // Load the cart items when the page loads
        window.onload = loadCart;
    </script>
</body>
</html>
